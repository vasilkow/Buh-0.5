<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Казна</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--tg-theme-text-color, #000000);
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-top: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 600;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .error {
            background: #ff3b30;
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Казна</h1>

        <div id="loading" class="loading">Загрузка...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="content" style="display: none;">
            <div class="card">
                <div class="card-title">Общий баланс</div>
                <div class="card-value" id="totalBalance">0 ₽</div>
            </div>

            <div class="card">
                <div class="card-title">Твоя доля</div>
                <div class="card-value" id="myShare">0 ₽</div>
                <div class="card-subtitle" id="myPercent">0%</div>
            </div>

            <div class="card">
                <div class="card-title">5% с бизнесов</div>
                <div class="card-value" id="businessIncome">0 ₽</div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Пополнил</div>
                    <div class="stat-value" id="totalDeposits">0 ₽</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Снял</div>
                    <div class="stat-value" id="totalWithdraws">0 ₽</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn" onclick="sendCommand('deposit')">➕ Пополнить</button>
                <button class="btn" onclick="sendCommand('withdraw')">➖ Снять</button>
                <button class="btn btn-secondary" onclick="sendCommand('business')">🏢 С бизнеса</button>
                <button class="btn btn-secondary" onclick="sendCommand('debts')">💳 Долги</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const userId = tg.initDataUnsafe.user?.id;

        async function loadData() {
            try {
                // Здесь должен быть API запрос к боту
                // Пока используем демо-данные
                const data = {
                    totalBalance: 150000,
                    myShare: 75000,
                    myPercent: 50,
                    businessIncome: 25000,
                    totalDeposits: 100000,
                    totalWithdraws: 25000
                };

                document.getElementById('totalBalance').textContent = formatMoney(data.totalBalance);
                document.getElementById('myShare').textContent = formatMoney(data.myShare);
                document.getElementById('myPercent').textContent = data.myPercent + '%';
                document.getElementById('businessIncome').textContent = formatMoney(data.businessIncome);
                document.getElementById('totalDeposits').textContent = formatMoney(data.totalDeposits);
                document.getElementById('totalWithdraws').textContent = formatMoney(data.totalWithdraws);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = 'Ошибка загрузки данных';
                document.getElementById('error').style.display = 'block';
            }
        }

        function formatMoney(amount) {
            return amount.toLocaleString('ru-RU') + ' ₽';
        }

        function sendCommand(command) {
            tg.sendData(JSON.stringify({ command: command }));
        }

        loadData();
    </script>
</body>
</html>
